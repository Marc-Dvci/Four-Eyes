# On every push: lint, format and types (Python); the tests, including the browser tests with axe-core; coverage of
# the C decision core with gcov and of the Python host side; the case set scored; spelling and links; and the demo
# Docker image, started and asked for a verdict. The QNX build itself needs the QNX SDP, which a hosted runner does not
# have: it is built and run locally (README, "Build for QNX"). Read-only: nothing here writes to the repository.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts are executable from a clean clone
        run: test -z "$(git ls-files -s '*.sh' | grep '^100644')"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Tests in random order, with coverage of the Python host side
        shell: bash
        run: python -m pytest -q --cov --randomly-seed="$GITHUB_RUN_ID" | tee pytest.log
      - name: Coverage of the C decision core (gcov)
        run: bash scripts/coverage_core.sh 90
      - name: The case set, every rule configuration, and the held-out set
        run: |
          python tools/score.py
          python tools/score.py --heldout
      - name: Summary on the run page
        if: always()
        shell: bash
        run: |
          count() { python -m pytest --collect-only -q -p no:randomly -m "$1" 2>/dev/null | tail -n 1 | grep -Eo '^[0-9]+' || echo 0; }
          {
            echo "### Tests"
            grep -E "passed|failed" pytest.log | tail -n 1
            echo
            echo "| Kind | Tests |"
            echo "|---|---|"
            echo "| Unit | $(count 'not integration and not e2e and not live') |"
            echo "| Integration | $(count integration) |"
            echo "| End-to-end (browser) | $(count e2e) |"
            echo
            echo "### Decision core coverage (C, gcov)"
            cat build/host/coverage.md || true
            echo
            echo "### Case set (gate core, a model that obeys every request)"
            python tools/score.py
            python tools/score.py --heldout
          } >> "$GITHUB_STEP_SUMMARY"
      - run: codespell
      - run: python scripts/check_links.py
      - run: python scripts/check_placeholders.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t four-eyes:demo .
      - name: The image starts, serves the page and refuses an unlock at 80 km/h
        run: bash scripts/docker_smoke.sh four-eyes:demo
